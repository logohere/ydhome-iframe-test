<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>YD Home × Magic Cabinet iframe QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f3ee; color: #1d1d1f; }
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 12px 16px; border-bottom: 1px solid #d7d3ca; background: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    strong { font-size: 14px; }
    code { font-size: 12px; overflow-wrap: anywhere; }
    .status { margin-left: auto; font-size: 12px; color: #666; }
    .frame-wrap { min-height: 0; height: calc(100vh - 58px); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>YD Home × Magic Cabinet iframe QA</strong>
    <code id="target"></code>
    <span class="status">GitHub Pages parent • Wix-equivalent sandbox</span>
  </header>
  <div class="frame-wrap">
    <iframe
      id="designer"
      title="Magic Cabinet YD Home kitchen designer"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"
      allow="fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('target') || 'https://app.magiccabinetai.com/design/ydhome?embed=1&qa=github';
    document.getElementById('target').textContent = target;
    document.getElementById('designer').src = target;
  </script>
</body>
</html>
